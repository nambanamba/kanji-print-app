# アプリの「🐙 GitHubに報告して消してもらう」で作られた削除報告Issueから、
# kanji-data.js を直すプルリクを自動で作る。
#
# 端末側の操作はこれまでどおり（🚫を押してIssueを出すだけ）。
# 出来たプルリクの中身を確認して Merge すれば GitHub Pages に反映される。
# 自動でマージはしない。
#
# kosukequiz-battle の apply-quiz-fix.yml と同じ作りに揃えている。
name: 削除報告からプルリクを作る

on:
  issues:
    types: [opened]
  # うまくいかなかったIssueをあとから流しなおす用
  workflow_dispatch:
    inputs:
      issue_number:
        description: 対象のIssue番号
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    # 自分が出した報告Issueだけを対象にする（よそからのIssueで動かさない）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.author_association == 'OWNER' &&
       startsWith(github.event.issue.title, '[漢字データ削除]'))
    steps:
      - uses: actions/checkout@v4

      - name: 対象のIssueを読む
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,body,author \
            > /tmp/issue.json
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: 手で流したときも削除報告のIssueか確かめる
        run: |
          set -euo pipefail
          title=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/issue.json","utf8")).title)')
          case "$title" in
            "[漢字データ削除]"*) echo "対象: $title" ;;
            *) echo "削除報告のIssueではありません: $title"; exit 1 ;;
          esac

      - name: kanji-data.js から語を消す
        id: apply
        run: |
          set -euo pipefail
          # Issue本文はシェルに直接展開せず、環境変数経由でスクリプトに渡す
          ISSUE_BODY=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/issue.json","utf8")).body || "")') \
            node .github/scripts/apply-kanji-removal.js

      - name: プルリクを作る
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
          COUNT: ${{ steps.apply.outputs.count }}
          IDS: ${{ steps.apply.outputs.ids }}
          WORDS: ${{ steps.apply.outputs.words }}
          TITLE: ${{ steps.apply.outputs.title }}
        run: |
          set -euo pipefail
          branch="remove-kanji/issue${NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add kanji-data.js
          git commit -m "$TITLE" -m "報告Issue #${NUMBER} の内容を kanji-data.js に反映しました。"
          git push -u origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "$TITLE" \
            --body "$(printf 'アプリの「🐙 GitHubに報告して消してもらう」からの報告 #%s を kanji-data.js に反映しました。\n\n- 消した語: %s（%s語）\n- id: `%s`\n\nKANJI_UNITS の count も合わせています。\n\n中身を確認して問題なければマージしてください。マージすると GitHub Pages に反映されます。\n\n## 残っている作業（このプルリクには入りません）\n\n- 元データJSON（Googleドライブ）… Issue本文の表にファイル名があります\n- kosukequiz-battle 側の `data.js` の `KANJI_DATA`\n\n元データを直さないと、次の再取り込みで戻ってしまうので注意してください。\n\nCloses #%s\n' "$NUMBER" "$WORDS" "$COUNT" "$IDS" "$NUMBER")"

      - name: 適用できなかったときはIssueに知らせる
        if: steps.apply.outputs.applied != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
          REASON: ${{ steps.apply.outputs.reason }}
        run: |
          set -euo pipefail
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$(printf '自動でプルリクを作れませんでした。\n\n理由: %s\n\n手で直す必要があります。\n' "$REASON")"
